name: PR 제목

# feature는 squash 머지라 develop에는 커밋이 아니라 PR 제목이 남아요.
# 그래서 커밋 훅과 같은 commitlint.config.js로 PR 제목도 검사해요.
# synchronize도 넣어야 새 커밋에도 이 검사 결과가 붙어요.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 제목 검사에는 husky와 토큰 빌드(prepare)가 필요 없어요.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 제목을 run에 바로 넣으면 셸 명령으로 해석될 수 있어서 환경 변수로 넘겨요.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
