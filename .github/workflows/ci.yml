name: CI

on:
  pull_request:

# 같은 PR에 새로 push하면 이전 커밋의 결과는 필요 없어요.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 package.json의 packageManager를 읽어요.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # react 테스트와 스토리 테스트가 실제 Chromium에서 돌아요.
      - run: pnpm --filter @d5ng/react exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
