name: ✨ 새 컴포넌트
description: 아직 없는 컴포넌트나 기능이 필요할 때
title: "[컴포넌트명] "
labels: ["type: feature"]
body:
  - type: textarea
    id: need
    attributes:
      label: 어떤 상황에서 필요한가요?
      description: API보다 쓰는 상황을 먼저 적어 주세요. 상황이 분명해야 API를 제대로 정할 수 있습니다.
      placeholder: 설정 화면에서 켜고 끄는 항목이 많은데, 체크박스는 '즉시 반영'이라는 느낌이 약하다
    validations:
      required: true

  - type: input
    id: figma
    attributes:
      label: Figma 링크
      description: 디자인이 있다면 해당 노드 링크를 붙여 주세요.
      placeholder: https://www.figma.com/design/...

  - type: textarea
    id: usage
    attributes:
      label: 이렇게 쓰고 싶어요
      description: 상상한 사용 코드. 정답이 아니어도 됩니다.
      render: tsx
      placeholder: <Switch checked={on} onCheckedChange={setOn}>알림 받기</Switch>

  - type: textarea
    id: reference
    attributes:
      label: 참고
      description: 비슷한 라이브러리 사례(Radix, MUI 등)나 아직 고민 중인 점. 없으면 비워 두세요.
