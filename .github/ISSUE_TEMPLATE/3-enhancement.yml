name: 🔧 개선
description: 이미 있는 컴포넌트나 토큰을 바꾸고 싶을 때
title: "[컴포넌트명] "
labels: ["type: enhancement"]
body:
  - type: textarea
    id: current
    attributes:
      label: 지금은 어떤가요?
      description: 바꾸기 전 모습. 이게 있어야 나중에 무엇이 달라졌는지 비교할 수 있습니다.
      placeholder: Button의 loading 상태에서 버튼 너비가 줄어든다
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 어떻게 바뀌면 좋겠나요?
      description: 바뀐 모습과 그 이유. 이유가 있어야 나중에 되돌릴지 판단할 수 있습니다.
      placeholder: 스피너가 보여도 너비가 그대로 유지되면 좋겠다. 클릭 직후 레이아웃이 흔들려서 어색하다
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 기존 사용처가 깨지나요?
      description: props나 토큰의 이름이 바뀌거나 사라지면 '예'입니다.
      options:
        - 아니오
        - 예 (breaking 라벨을 붙여 주세요)
        - 모르겠음
    validations:
      required: true
